[package]
name = "redissub"
version = "0.1.0"
edition = "2021"
description = "A modern CLI stream processor and event harvester for Redis Pub/Sub, Keyspace Notifications, and Streams"
license = "MIT"
authors = ["Animesh Raj <animesh080808@gmail.com>"]
repository = "https://github.com/itsarraj/redissub"
readme = "README.md"
keywords = ["redis", "pubsub", "streaming", "cli", "telemetry"]
categories = ["command-line-utilities", "network-programming", "development-tools"]

[lib]
name = "redissub"
path = "src/lib.rs"

[[bin]]
name = "redissub"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
colored = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
